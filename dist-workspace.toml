# cargo-dist configuration — see https://opensource.axo.dev/cargo-dist/
#
# This drives the autogenerated `.github/workflows/release.yml`. After changing
# anything here, regenerate the workflow with `dist generate` (CI also verifies
# it is in sync via `dist generate --check`).

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# release-please owns the git tag AND the GitHub Release (it runs on merge of the
# release PR and creates both). dist must NOT create its own Release, or its host
# job's `gh release create <tag>` collides with the Release release-please already
# made and fails the cut. With create-release = false, dist instead UPLOADS its
# artifacts into the existing Release. (Tagging still happens via release-please,
# so the `on: push: tags` trigger for release.yml is preserved.)
create-release = false
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "nexus-xyz/homebrew-tap"
# Publish jobs to run in CI:
#  - "homebrew": push the generated formula to the tap above.
#  - "./minisign": custom job (.github/workflows/minisign.yml) that verifies each
#    artifact's build-provenance attestation and attaches a detached minisign
#    (.minisig) signature to it.
publish-jobs = ["homebrew", "./minisign"]
# Customize the Homebrew formula name
formula = "nexus"
# Checksums to generate for each App
checksum = "sha256"
# Whether to enable GitHub Attestations
github-attestations = true
# Which actions to run on pull requests. Run the full cross-platform build on
# every PR (not just `plan`), so the release pipeline is exercised as a real,
# blocking check. Artifacts are uploaded to the workflow run as a dry-run; no
# GitHub Release is created and no publish jobs run on PRs.
pr-run-mode = "upload"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# --- macOS code signing ------------------------------------------------------
# Code-signing the macOS binaries with an Apple Developer ID certificate is
# supported, but DISABLED until a real certificate secret is configured. dist's
# macOS path does NOT skip when the cert is absent — it tries to import an empty
# certificate and the build fails. Since we now build on every PR
# (pr-run-mode = upload), leaving this on with no cert would break every build,
# not just releases. (This once said "unlike the Windows/SSL.com path". That was
# wrong in the same way the Windows comment below was: neither path skips a
# missing credential — see ENG-9357.)
#
# To enable: add the CODESIGN_CERTIFICATE / CODESIGN_CERTIFICATE_PASSWORD /
# CODESIGN_IDENTITY secrets (see README) and set this to `true`.
#
# NOTE: even when enabled, dist 0.31 signs but does not *notarize*. Notarization
# only adds value for a stapled bundle (.pkg/.dmg) — a loose CLI binary can't be
# stapled — so it's deferred until/unless we ship a .pkg installer.
macos-sign = false
# --- Windows code signing ----------------------------------------------------
# Authenticode signing of the Windows binaries and .msi (dist's
# `ssldotcom-windows-sign = "prod"`, via SSL.com eSigner) is DELIBERATELY OFF.
# Absence of the key is the off state — dist rejects a boolean here ("wanted
# string or table"), so do not "disable" it by writing `false`.
#
# Why it is off, so this does not get read as an oversight and "fixed":
#   * We never held an SSL.com eSigner credential. The four SSLDOTCOM_* secrets
#     exist in no scope (repo, org, or environment), and the env dump on the
#     LAST GREEN run (2026-07-17) already shows all four empty — so this was
#     never a certificate that lapsed. Turning signing back on is not a
#     rotation: it means buying a certificate.
#   * The behaviour changed underneath us, which is why it looked like an
#     expiry. `${{ secrets.X }}` expands a missing secret to the empty string,
#     so dist saw present-and-empty credentials throughout. Until 2026-07-17 it
#     skipped signing on those (no SSL.com call appears in that job's log, and
#     the .msi shipped unsigned). From 2026-07-18 every run instead attempted
#     the OAuth exchange and SSL.com answered `invalid_grant`. Nothing in this
#     repo changed between the two — dist is pinned at 0.31.0 and this file was
#     untouched from 06-25 to 08-13. The timing read as a credential expiring
#     and was misfiled as one three times (ENG-7534 / ENG-9607 / ENG-9357).
#   * The Windows target is 12 of 6,268 all-time downloads (0.2%), and GitHub's
#     counter is not deduplicated — CI, crawlers and mirrors included — so 12 is
#     an upper bound. It cost every release: no `Release` run has gone green
#     since 2026-07-17 (ENG-9357).
#
# What this does NOT change: the Windows target stays in `targets` above and the
# archive/.msi ship exactly as before, with their .minisig and their GitHub
# build-provenance attestation. Only Authenticode — the signature SmartScreen
# checks — is gone. Windows users get a dismissible SmartScreen prompt; a
# managed host running WDAC/AppLocker in enforcement may block the binary
# outright. README documents both.
#
# To re-enable: buy an SSL.com eSigner certificate, add SSLDOTCOM_USERNAME /
# SSLDOTCOM_PASSWORD / SSLDOTCOM_CREDENTIAL_ID / SSLDOTCOM_TOTP_SECRET as
# *repository* secrets (this job declares no `environment:`, so environment
# secrets are unreadable to it), restore `ssldotcom-windows-sign = "prod"` here,
# and regenerate. Note that `pr-run-mode = "upload"` runs this on pull requests
# too, so doing so re-couples every contributor's PR status to a production
# secret — decide that deliberately rather than inheriting it.

# Grant the custom minisign publish job exactly the scope it needs and nothing
# more: write access to release assets so it can attach .minisig files, and read
# access to attestations so it can `gh attestation verify` each artifact's build
# provenance before signing it. Custom publish jobs otherwise default to
# id-token/packages, which cannot upload release assets. Least privilege.
#
# NOTE: this sub-table must come after all flat [dist] keys above; in TOML a
# table header ends the preceding table.
[dist.github-custom-job-permissions]
minisign = { contents = "write", attestations = "read" }
