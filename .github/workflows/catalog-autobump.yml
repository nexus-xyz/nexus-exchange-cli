name: Examples catalog autobump

# Keep the examples catalog built into the binary pinned to the newest tag
# (ENG-17337). `nexus examples list/show` fall back to that copy when the
# examples repository can't be reached and nothing is cached, so a stale pin
# means offline users see an old catalog. This makes "pin the catalog before a
# release" something nobody has to remember.
#
# HOW IT RUNS. A daily poll of the examples repo's tags. It tags every green
# commit on main `catalog-YYYY.MM.DD` (its `tag-catalog.yml`), so the newest tag
# is always a state in which every example built. When that tag differs from
# `src/examples_catalog.ref`, this runs `scripts/sync_examples_catalog.sh` (the
# same script a human would) and opens a PR. Reading tags needs no secret.
#
# CHECKS. Same token as sdk-autobump: the PR is opened with a token minted from
# the release GitHub App, so its CI runs without a human approving it
# (ENG-17793). The sync script also validates the catalog before it writes
# anything.
#
# SCHEMA. A catalog on a schema this CLI doesn't understand fails the sync
# script, so no PR is opened and the run goes red. That one needs a code change
# in `src/examples.rs`, not a pin bump.

on:
  schedule:
    # Daily, offset from sdk-autobump (08:47) and the examples repo's CI.
    - cron: "13 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "catalog-* tag to pin (defaults to the newest)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: catalog-autobump
  cancel-in-progress: false

env:
  EXAMPLES_REPO: https://github.com/nexus-xyz/nexus-exchange-examples

jobs:
  autobump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Mint a token from the org release GitHub App (nexus-release-bot2), the same
      # one release-please.yml uses. A PR pushed and opened with the default
      # GITHUB_TOKEN leaves its CI / spec-drift runs at `action_required` until a
      # human approves them; one opened with an App-installation token runs them
      # (ENG-17793).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Is there a newer catalog tag?
        id: gate
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < src/examples_catalog.ref)"
          if [ -n "${INPUT_TAG:-}" ]; then
            target="$INPUT_TAG"
          else
            target="$(git ls-remote --tags --refs "$EXAMPLES_REPO" 'catalog-*' \
              | sed 's#.*refs/tags/##' | sort -V | tail -1)"
          fi
          if [ -z "$target" ]; then
            echo "The examples repo has no catalog-* tag yet; nothing to pin."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validated before it reaches a URL, a branch name or a commit message.
          if [[ ! "$target" =~ ^catalog-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::'$target' is not a catalog-YYYY.MM.DD[.N] tag"
            exit 1
          fi
          if [ "$target" = "$current" ]; then
            echo "Already pinned to $current."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Pinned: $current; newest: $target."
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "old=$current" >> "$GITHUB_OUTPUT"
          echo "new=$target" >> "$GITHUB_OUTPUT"

      - name: Apply the pin
        if: steps.gate.outputs.proceed == 'true'
        env:
          NEW: ${{ steps.gate.outputs.new }}
        run: |
          set -euo pipefail
          cp src/examples_catalog.json "$RUNNER_TEMP/old-catalog.json"
          scripts/sync_examples_catalog.sh "$NEW"

      - name: Open the pin PR
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OLD: ${{ steps.gate.outputs.old }}
          NEW: ${{ steps.gate.outputs.new }}
          CHECKS: will-run
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No file change after the pin; nothing to open."
            exit 0
          fi

          branch="chore/examples-catalog-${NEW}"
          # Same idempotency rules as sdk-autobump: an existing PR in any state
          # (a human-closed one stays closed), else a pushed branch with no PR.
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "A PR for $branch already exists (any state); nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::warning::branch $branch exists upstream but has no PR. Open one from it, or delete it and let the next poll retry."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/examples_catalog.json src/examples_catalog.ref
          git commit -m "chore(examples): pin the built-in catalog to ${NEW}"
          git push --set-upstream origin "$branch"

          python3 scripts/render_catalog_pin_body.py \
            --old-ref "$OLD" --new-ref "$NEW" \
            --old "$RUNNER_TEMP/old-catalog.json" --new src/examples_catalog.json \
            --pr-checks "$CHECKS" > "$RUNNER_TEMP/pr-body.md"

          gh label create "catalog-autobump" --color "0e8a16" \
            --description "Automated examples catalog pin (ENG-17337)" \
            || echo "::notice::label 'catalog-autobump' already exists or could not be created"

          # Nothing below may be fatal: the branch is pushed, and losing this
          # step would leave it with no PR.
          gh pr create --base main --head "$branch" \
            --title "chore(examples): pin the built-in catalog to ${NEW}" \
            --body-file "$RUNNER_TEMP/pr-body.md" --label "catalog-autobump" \
          || gh pr create --base main --head "$branch" \
            --title "chore(examples): pin the built-in catalog to ${NEW}" \
            --body-file "$RUNNER_TEMP/pr-body.md"

          # Pure data, validated by the sync script, so arm auto-merge where the
          # repo allows it. Required checks and review still gate the merge.
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge' || echo false)" = "true" ]; then
            gh pr merge "$branch" --auto --squash \
              || echo "::warning::could not arm auto-merge; a human must merge this PR."
          else
            echo "::notice::allow_auto_merge is off on ${GITHUB_REPOSITORY}; a human must merge this PR."
          fi
