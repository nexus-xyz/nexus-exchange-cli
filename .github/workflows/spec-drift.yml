name: Spec drift

# Verifies the spec operations the CLI's commands exercise (endpoints.txt) all
# still exist in the pinned OpenAPI spec (.api-version), that the commands and
# endpoints.txt stay in sync (every entry is backed by a real `client.<method>()`
# call, and vice versa, modulo the documented allowlists), that neither allowlist
# is holding a stale exemption, and reports the CLI's API coverage % — the number
# the dashboard's CLI panel reads. Mirrors the same workflow in the Rust SDK
# (nexus-exchange-rs). Fetches the spec from the raw-at-tag URL and caches it by
# the pinned version so a normal run does no network.
#
# Runs on EVERY pull request, deliberately (ENG-7962). It used to be filtered to
# `.api-version`, `endpoints.txt`, the script, and the two files in CLI_SOURCES.
# That did trigger on a pin-only bump — the pin is in the list, and the pin *is*
# the change — but it left two holes:
#
#   1. a `paths`-filtered workflow is skipped, not run, on unrelated PRs, so it
#      cannot serve as a required status check without wedging every such PR;
#   2. moving a command handler into a NEW module dodged the filter entirely —
#      the file wasn't listed, so drift never ran on the PR that introduced it.
#      (Invariant 4 in the checker now also fails such a module outright, so the
#      two defences are independent.)
#
# The pinned spec is cached by tag, so the added runs are a checkout plus a few
# seconds of Python.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned spec version
        id: pin
        run: |
          tag="$(cat .api-version)"
          # Validate before it reaches any URL / cache key: a crafted
          # .api-version on a fork PR could otherwise inject into the fetch.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::.api-version must look like vX.Y.Z (got: '$tag')"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned spec
        id: cache
        uses: actions/cache@v4
        with:
          path: openapi.pinned.json
          key: spec-${{ steps.pin.outputs.tag }}

      - name: Fetch spec (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # Passed via env (not interpolated into the script) so the tag is
          # data, not code; it is validated to ^v[0-9.]+$ above.
          SPEC_REF: ${{ steps.pin.outputs.tag }}
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/nexus-xyz/nexus-exchange-api/${SPEC_REF}/openapi.json" \
            -o openapi.pinned.json

      # Self-test the checker before trusting a green run from it: proves each of
      # the four invariants goes RED when defeated (ENG-7962). Hermetic — no
      # network, no pinned spec. Runs first so a broken checker fails with a clear
      # message rather than a misleading "OK".
      - name: Self-test the drift checker
        run: python3 scripts/test_check_spec_drift.py

      - name: Check drift
        run: python3 scripts/check_spec_drift.py openapi.pinned.json

      # Invariants 5-6 (ENG-7962): the pin is only correct if it equals the pin of
      # the `nexus-exchange` crate we actually compile against — that crate is what
      # sends `X-Nexus-Api-Version`, so a pin ahead of it is a false claim about
      # runtime. And every endpoints.txt line must be an operation the crate really
      # wraps, since the CLI reaches the API only through named SDK methods.
      #
      # This is the check whose absence let `amend_order` sit mapped to
      # `PUT /orders/{order_id}` while the SDK issues `PATCH`: the SDK's own manifest
      # lists no PUT on that path, so invariant 6 fails it immediately, where the
      # spec-only check could not.
      #
      # Reads both files out of the published .crate tarball (the exact artifact
      # cargo builds), so it needs no token and makes no assumption about how rs
      # names its tags.
      - name: Check SDK parity
        run: python3 scripts/check_sdk_parity.py

      - name: Publish coverage to the step summary
        if: always()
        run: |
          # Re-run for a clean, parseable line; the gate above is the source of
          # truth for pass/fail. The "X of Y (Z% coverage)" line is what the
          # dashboard scrapes for the CLI API-coverage panel.
          line="$(python3 scripts/check_spec_drift.py openapi.pinned.json \
            | grep -E 'CLI targets [0-9]+ of [0-9]+' || true)"
          {
            echo "### CLI API coverage"
            echo ""
            echo "${line:-coverage line unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
