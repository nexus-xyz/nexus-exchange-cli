name: Spec autobump

# Auto-pick-up a new nexus-exchange-api spec release. Nothing detected a newer
# spec before this (ENG-7962): pin bumps were manual, so the CLI could fall behind
# silently — the drift check only ever answers "do we still match the pin we have?"
#
# When the api repo cuts a release it fans out a `repository_dispatch`
# (`spec-released`, carrying the new tag); a daily `schedule` poll is the
# self-healing fallback if a dispatch is dropped. Either way this workflow:
#
#   1. resolves the target tag (dispatch payload, `workflow_dispatch` input, or
#      the api repo's latest release) and confirms it is newer than `.api-version`,
#   2. fetches the currently-pinned spec and the target spec (same raw-at-tag URL
#      the spec-drift check uses),
#   3. runs oasdiff to classify old-pin -> new as BREAKING vs NON-BREAKING,
#   4. bumps `.api-version` + the README managed line (scripts/sync_api_version.py)
#      and nothing else, and opens a PR.
#
#   * NON-BREAKING -> label `spec-autobump`, try to arm auto-merge (squash).
#   * BREAKING     -> label `breaking · needs-SDK-update`, request review, do NOT
#                     arm auto-merge.
#
# Ported from nexus-exchange-rs's workflow of the same name, the reference
# implementation for ENG-3563 (see that repo's docs/spec-autobump-replication.md).
# Two deliberate divergences from it, both for reasons specific to this repo:
#
# SAFETY / HONESTY: `allow_auto_merge` is currently **disabled** on this
#   repository, so rs's bare `gh pr merge --auto` would fail and — with the rest of
#   the step still succeeding — leave a PR that reads as automated but is inert.
#   That is the ENG-7688 failure shape. The arming step here probes the repo
#   setting, records `armed` / `unavailable`, and the PR body says which happened.
#   Enabling the setting is a repo-admin change, out of scope here; ENG-4149 gates
#   actual auto-landing regardless, so nothing merges unattended today either way.
#
# ORDERING: the CLI depends on the published `nexus-exchange` crate and issues no
#   path of its own, so a spec release that renames an operation the CLI targets
#   cannot be satisfied here until that crate ships a regenerated wrapper. Such a
#   PR legitimately sits RED on `spec-drift` while it waits. The PR body states
#   this so a red check isn't mistaken for a broken one — and warns against
#   "fixing" it by deleting the failing endpoints.txt lines.
#
# NOT LIVE UNTIL DISPATCHED TO: this repo is still commented out of the api repo's
# spec-dispatch.yml matrix (ENG-3563). Until it is added, only the daily poll and
# manual `workflow_dispatch` reach here — which is enough to stop silent lag.

on:
  repository_dispatch:
    types: [spec-released]
  schedule:
    # Daily fallback poll; the dispatch from the api repo is the fast path. Offset
    # from the SDK's 08:23 so the two don't contend for the same runner minute.
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Spec tag to evaluate (e.g. v0.7.2). Defaults to api repo latest."
        required: false

permissions:
  contents: write
  pull-requests: write
  # Labels are an Issues-scoped resource, so creating them and attaching them to
  # the PR needs this even though the target is a pull request.
  issues: write

concurrency:
  # Serialize on the workflow, not the tag: two near-simultaneous releases must
  # not race to bump the same pin.
  group: spec-autobump
  cancel-in-progress: false

env:
  SPEC_REPO: nexus-xyz/nexus-exchange-api

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the bump token (ENG-4149) so the opened PR triggers the required
          # checks (spec-drift, CI). A PR opened with the default GITHUB_TOKEN does
          # not trigger other workflows, which would leave it permanently pending.
          token: ${{ secrets.SDK_DISPATCH_TOKEN || github.token }}

      - name: Resolve target tag
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }} # lifts the releases-API rate limit
          # Dispatch payload tag is repo-controlled, but keep it as data.
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            # Scheduled path: ask the api repo for its latest release tag.
            tag="$(gh api "repos/${SPEC_REPO}/releases/latest" --jq .tag_name)"
          fi
          # Validate strictly before the tag reaches a URL, a file, or a branch
          # name — a dispatch payload is untrusted data.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::resolved tag is not vX.Y.Z: '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pinned=$(cat .api-version)" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $tag (currently pinned: $(cat .api-version))"

      - name: Stop if not newer than the pin
        id: gate
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Reuse the lag check; exit 3 == behind (a newer spec exists), 0 == current.
          if python3 scripts/sync_api_version.py --check --latest "$NEW_TAG"; then
            echo "Pin is already at or ahead of $NEW_TAG; nothing to bump."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "A newer spec ($NEW_TAG) is available; proceeding."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::sync_api_version.py --check failed (exit $rc)"
              exit "$rc"
            fi
          fi

      - name: Fetch pinned + target specs
        if: steps.gate.outputs.proceed == 'true'
        env:
          OLD_TAG: ${{ steps.resolve.outputs.pinned }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Same raw-at-tag URL the spec-drift check uses.
          curl -fsSL "https://raw.githubusercontent.com/${SPEC_REPO}/${OLD_TAG}/openapi.json" -o /tmp/spec-old.json
          curl -fsSL "https://raw.githubusercontent.com/${SPEC_REPO}/${NEW_TAG}/openapi.json" -o /tmp/spec-new.json

      - name: Install oasdiff
        if: steps.gate.outputs.proceed == 'true'
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Classify old-pin -> new with oasdiff
        if: steps.gate.outputs.proceed == 'true'
        id: oasdiff
        run: |
          set -euo pipefail
          # Informational changelog in the log for the PR reviewer.
          oasdiff changelog /tmp/spec-old.json /tmp/spec-new.json || true

          # Capture the breaking summary for the PR body.
          oasdiff breaking /tmp/spec-old.json /tmp/spec-new.json --format text \
            > /tmp/oasdiff-breaking.txt 2>&1 || true

          # The classification: same gate the api repo's "Classify API changes"
          # uses. `--fail-on ERR` exits non-zero iff there is an ERR-level
          # (breaking) change; WARN/INFO-level changes are non-breaking.
          if oasdiff breaking /tmp/spec-old.json /tmp/spec-new.json --fail-on ERR; then
            echo "verdict=non-breaking" >> "$GITHUB_OUTPUT"
            echo "No ERR-level (breaking) changes — NON-BREAKING."
          else
            echo "verdict=breaking" >> "$GITHUB_OUTPUT"
            echo "ERR-level (breaking) change(s) detected — BREAKING."
          fi

      - name: Apply the pin bump
        if: steps.gate.outputs.proceed == 'true'
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/sync_api_version.py --write --latest "$NEW_TAG"

      # `gh pr create --label` fails outright on a label the repo doesn't have, and
      # neither of these exists here yet (they do on nexus-exchange-rs, which is
      # why its workflow can assume them). Create-if-missing keeps the first real
      # run from dying on repo setup, and `|| true` keeps a concurrent creation or
      # a permissions refusal from being fatal — a missing label must not cost us
      # the PR, so the create step below tolerates the label being absent too.
      - name: Ensure the autobump labels exist
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh label create "spec-autobump" \
            --color "0e8a16" \
            --description "Automated non-breaking .api-version bump (ENG-7962)" \
            || echo "::notice::label 'spec-autobump' already exists or could not be created"
          gh label create "breaking · needs-SDK-update" \
            --color "d93f0b" \
            --description "Spec bump is breaking; needs human SDK changes (ENG-7962)" \
            || echo "::notice::label 'breaking · needs-SDK-update' already exists or could not be created"

      - name: Open the bump PR
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN || github.token }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
          OLD_TAG: ${{ steps.resolve.outputs.pinned }}
          VERDICT: ${{ steps.oasdiff.outputs.verdict }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No file change after bump — nothing to open."
            exit 0
          fi

          branch="chore/spec-autobump-${NEW_TAG}"

          # Idempotent: if the branch already exists upstream, or an open PR is
          # already on it, leave it rather than churning a duplicate each poll.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists upstream; nothing to do."
            exit 0
          fi
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "An open PR for $branch already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .api-version README.md
          git commit -m "chore(spec): bump .api-version to ${NEW_TAG}"
          git push --set-upstream origin "$branch"

          # Decide auto-merge BEFORE rendering the body, so the body states what
          # actually happened rather than what we hoped would.
          auto_merge="skipped"
          if [ "$VERDICT" = "non-breaking" ]; then
            # The branch is already pushed, so nothing from here on may be fatal:
            # losing the step now would leave a branch with no PR on it. A failed
            # or empty probe reads as "not allowed", which is the safe direction.
            allowed="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge' || echo false)"
            if [ "$allowed" = "true" ]; then
              # Arming does not merge: the PR still needs its required checks and
              # the ENG-4149 bypass.
              if gh pr merge "$branch" --auto --squash; then
                auto_merge="armed"
              else
                auto_merge="unavailable"
                echo "::warning::auto-merge is enabled on this repo but arming it failed; a human must merge."
              fi
            else
              auto_merge="unavailable"
              echo "::warning::allow_auto_merge is disabled on ${GITHUB_REPOSITORY}, so auto-merge was NOT armed. A human must merge this PR. (ENG-4149 gates auto-landing anyway.)"
            fi
          fi

          # Render the body in Python (the markdown is dense with backticks and
          # ${...} examples — keeping it out of inline shell avoids quoting traps).
          python3 scripts/render_autobump_pr_body.py \
            --new-tag "$NEW_TAG" \
            --old-tag "$OLD_TAG" \
            --verdict "$VERDICT" \
            --oasdiff-file /tmp/oasdiff-breaking.txt \
            --auto-merge "$auto_merge" \
            > "$RUNNER_TEMP/pr-body.md"

          if [ "$VERDICT" = "non-breaking" ]; then
            label="spec-autobump"
          else
            label="breaking · needs-SDK-update"
          fi

          # Retry without the label rather than losing the PR if the label step
          # above could not create it.
          gh pr create --base main --head "$branch" \
            --title "chore(spec): bump .api-version to ${NEW_TAG}" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --label "$label" \
          || gh pr create --base main --head "$branch" \
            --title "chore(spec): bump .api-version to ${NEW_TAG}" \
            --body-file "$RUNNER_TEMP/pr-body.md"

          if [ "$VERDICT" != "non-breaking" ]; then
            # Route to a human; auto-merge stays unarmed regardless of the setting.
            gh pr edit "$branch" --add-reviewer nexus-xyz/eng \
              || echo "::warning::could not request review (team handle may differ); add a reviewer manually."
          fi
