name: Pre-publish

# The checks between a release PR and a GitHub Release (ENG-18798). A release reaches users as soon
# as release.yml undrafts it (the installer's `latest`, the Homebrew tap), so publishing stays a
# person merging the release PR; these make sure what they merge is not broken. Three jobs, with
# the same names in every SDK repo, so one required-checks setting covers the fleet:
#
#   prepublish-surface  the release binary's commands and flags equal the committed public-api.txt
#   prepublish-smoke    the release binary, installed clean, reads the public testnet
#   prepublish-verdict  the version the release PR proposes fits the spec change since the last
#                       publish, graded by the monorepo's classifier (scripts/release_gate/VENDORED.md)
#
# The drift checks are the fourth leg and are not repeated here: `drift` (spec-drift.yml: the spec,
# the SDK parity and the pin) already runs on every PR, the release PR among them.
#
# RUNS ON EVERY PR, with no `paths:` filter, for spec-drift.yml's reason: a required check that is
# skipped reports nothing, and the PR waits on it forever. What changes on a release PR (head branch
# `release-please--*`), or on a PR that edits this gate:
#   * smoke makes the testnet read. Elsewhere it builds and installs the binary only, and says so.
#   * verdict is enforced on a release PR. Elsewhere it reports what the next release will need.
# The surface check is enforced on every PR, because the PR that changes the CLI is where the
# snapshot has to move.
#
# The release PR's runs start on their own: release-please opens it with the nexus-release-bot2
# App token (release-please.yml), not GITHUB_TOKEN, so there is no "Approve and run workflows"
# click to wait for.
#
# These gate the release PR, not the tag. release.yml (generated by cargo-dist, so it can carry no
# guard of its own) publishes on any pushed version tag, and a tag pushed by hand skips this file.
# Closing that is a tag ruleset, not a workflow change.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pre-publish-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The version classify_spec_change.py requires (its OASDIFF_VERSION), by checksum, as the
  # monorepo installs it.
  OASDIFF_VERSION: 1.30.0
  OASDIFF_SHA256: bfa353e7c699dd201d52dd42839330a0d4ba0429767c8ec9fc0e5fdc650b8060

jobs:
  prepublish-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Commands and flags of the release binary vs public-api.txt
        run: scripts/release_gate/public_api.sh

  prepublish-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release PR, or a change to this gate?
        id: mode
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Into a file, not a pipe: under pipefail a failed `git diff`, or one cut short by
          # `grep -q` (SIGPIPE), would read as "not a gate change" and skip the read quietly.
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(\.github/workflows/pre-publish\.yml|scripts/release_gate/)' "$RUNNER_TEMP/changed.txt"; then
            echo "mode=gate-change" >> "$GITHUB_OUTPUT"
          else
            echo "mode=other" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, install clean, read testnet
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = "other" ]; then
            scripts/release_gate/smoke.sh --build-only
          else
            scripts/release_gate/smoke.sh
          fi

  prepublish-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tags: the spec pin of the published version is read at `v<version>`.
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff ${{ env.OASDIFF_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/oasdiff.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/oasdiff.tar.gz" oasdiff
          echo "OASDIFF=$RUNNER_TEMP/oasdiff" >> "$GITHUB_ENV"
      # The gate's own tests first, against the binary just installed: a broken gate fails as a
      # broken gate, and a vendored file that drifted from the monorepo fails here.
      - name: Self-test the gate
        run: python3 scripts/release_gate/test_release_verdict.py
      - name: Version proposed vs the spec change since the last publish
        env:
          HEAD_REF: ${{ github.head_ref }}
          # The published version is this repo's latest GitHub Release. Read with the job's own
          # read-only token: unauthenticated, the API allows 60 requests an hour per runner IP,
          # which runners share, and a rate-limited read is a could-not-classify on the release PR.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--registry github --package nexus-xyz/nexus-exchange-cli --manifest Cargo.toml)
          if [[ "$HEAD_REF" != release-please--* ]]; then
            args+=(--report)
          fi
          python3 scripts/release_gate/release_verdict.py "${args[@]}"
